<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>セーリングノット インタラクティブカタログ</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .knot-card { cursor: pointer; transition: all 0.2s; }
  .knot-card:hover { transform: translateY(-2px); }
  .knot-card.selected { border-color: #6366f1; }
  .step-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
  .rope { stroke-linecap: round; stroke-linejoin: round; fill: none; }
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
<script>
function escapeHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
</script>

<div class="max-w-6xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-indigo-400 mb-1">セーリングノット カタログ</h1>
  <p class="text-gray-400 text-sm mb-4">帆船・キャンプ・海洋スポーツ向け ロープワーク — SVGアニメーション手順付き</p>

  <div class="flex flex-col lg:flex-row gap-4">
    <!-- Left: filters + knot list -->
    <div class="w-full lg:w-72 flex-shrink-0">
      <!-- Search & filter -->
      <div class="mb-3 space-y-2">
        <input type="text" id="searchInput" placeholder="ノット名検索..." class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm">
        <select id="categoryFilter" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-1 text-sm">
          <option value="">すべてのカテゴリ</option>
          <option value="係留">係留</option>
          <option value="接続">接続</option>
          <option value="固定">固定</option>
          <option value="輪">輪</option>
          <option value="装飾">装飾</option>
        </select>
      </div>
      <div id="knotList" class="space-y-1 max-h-[60vh] overflow-y-auto pr-1"></div>
    </div>

    <!-- Right: detail -->
    <div class="flex-1 bg-gray-800 rounded-xl p-4">
      <div id="knotDetail">
        <p class="text-gray-500 text-center mt-12">左のリストからノットを選択してください</p>
      </div>
    </div>
  </div>
</div>

<script>

  },

    paths: ['M 50 20 L 35 50 M 50 20 L 50 55 M 50 20 L 65 50', 'M 50 20 L 35 50 C 33 60 40 65 50 60', 'M 50 20 L 50 55 C 55 65 62 63 65 55', 'M 50 20 L 65 50 C 68 60 62 68 52 65', 'M 35 50 C 33 65 42 72 52 68 C 62 72 70 65 65 55 C 62 45 55 42 50 55 C 42 55 36 58 35 50']

let selectedKnot = null;
let currentStep = 0;
let animInterval = null;

function renderKnotList() {
  const list = document.getElementById('knotList');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('categoryFilter').value;

  const filtered = knots.filter(k =>
    (k.name.includes(search) || k.en.toLowerCase().includes(search)) &&
    (cat === '' || k.category === cat)
  );

  list.innerHTML = '';
  filtered.forEach(knot => {
    const div = document.createElement('div');
    div.className = `knot-card p-2 rounded-lg border ${selectedKnot?.id === knot.id ? 'border-indigo-500 bg-indigo-900/30' : 'border-gray-700 bg-gray-800'} cursor-pointer`;
    div.innerHTML = `
      <div class="flex justify-between items-start">
        <div>
          <span class="font-semibold text-sm text-white">${escapeHtml(knot.name)}</span>
          <span class="text-xs text-gray-400 ml-2">${escapeHtml(knot.en)}</span>
        </div>
        <span class="text-xs bg-gray-700 rounded px-1 py-0.5 text-gray-300">${escapeHtml(knot.category)}</span>
      </div>
      <div class="flex gap-1 mt-1">
        ${renderStars(knot.strength, 'text-red-400')} <span class="text-xs text-gray-500 mx-1">強</span>
        ${renderStars(knot.ease, 'text-green-400')} <span class="text-xs text-gray-500">易</span>
      </div>
    `;
    div.addEventListener('click', () => selectKnot(knot));
    list.appendChild(div);
  });
}

function renderStars(n, cls) {
  return Array.from({length: 5}, (_, i) => `<span class="${i < n ? cls : 'text-gray-700'}">★</span>`).join('');
}

function selectKnot(knot) {
  selectedKnot = knot;
  currentStep = 0;
  if (animInterval) clearInterval(animInterval);
  renderKnotList();
  renderDetail();
}

function renderDetail() {
  const knot = selectedKnot;
  if (!knot) return;

  const detail = document.getElementById('knotDetail');
  detail.innerHTML = `
    <div class="mb-4">
      <div class="flex items-center gap-3 mb-2">
        <h2 class="text-xl font-bold text-yellow-300">${escapeHtml(knot.name)}</h2>
        <span class="text-gray-400 text-sm">${escapeHtml(knot.en)}</span>
        <span class="ml-auto text-xs bg-indigo-800 rounded-full px-2 py-0.5">${escapeHtml(knot.category)}</span>
      </div>
      <p class="text-gray-300 text-sm mb-2">${escapeHtml(knot.desc)}</p>
      <div class="flex gap-4 text-sm">
        <div><span class="text-gray-400">強度: </span>${renderStars(knot.strength, 'text-red-400')}</div>
        <div><span class="text-gray-400">解きやすさ: </span>${renderStars(knot.ease, 'text-green-400')}</div>
      </div>
      <div class="mt-2 flex flex-wrap gap-1">
        ${knot.uses.map(u => `<span class="text-xs bg-gray-700 rounded-full px-2 py-0.5 text-cyan-300">${escapeHtml(u)}</span>`).join('')}
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- SVG diagram -->
      <div class="bg-gray-900 rounded-xl p-4 flex flex-col items-center">
        <div class="text-sm text-gray-400 mb-2">手順 <span id="stepNum">${currentStep + 1}</span>/${knot.steps.length}</div>
        <svg id="knotSvg" viewBox="0 0 100 100" width="180" height="180" class="bg-gray-800 rounded-lg">
          <rect width="100" height="100" fill="#1f2937"/>
        </svg>
        <p id="stepDesc" class="text-sm text-gray-300 mt-2 text-center h-10 flex items-center">${escapeHtml(knot.steps[currentStep])}</p>
        <div class="flex gap-2 mt-2">
          <button onclick="prevStep()" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm">◀ 前</button>
          <button onclick="autoPlay()" id="autoBtn" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 rounded text-sm">自動再生</button>
          <button onclick="nextStep()" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm">次 ▶</button>
        </div>
        <div class="flex gap-1 mt-2" id="stepDots"></div>
      </div>

      <!-- Steps list -->
      <div>
        <h3 class="text-indigo-300 font-semibold text-sm mb-2">手順一覧</h3>
        <ol class="space-y-2">
          ${knot.steps.map((step, i) =>
            `<li class="flex gap-2 text-sm items-start">
              <span class="step-dot ${i === currentStep ? 'bg-indigo-500 text-white' : 'bg-gray-700 text-gray-400'}" onclick="jumpStep(${i})">${i+1}</span>
              <span class="${i === currentStep ? 'text-white' : 'text-gray-400'}">${escapeHtml(step)}</span>
            </li>`
          ).join('')}
        </ol>
      </div>
    </div>
  `;

  renderStep();
}

function renderStep() {
  const knot = selectedKnot;
  if (!knot) return;
  const svg = document.getElementById('knotSvg');
  if (!svg) return;

  // Draw all paths up to current step
  let pathsHtml = `<rect width="100" height="100" fill="#1f2937"/>`;
  const colors = ['#60A5FA','#818CF8','#A78BFA','#C084FC','#E879F9','#F472B6'];

  for (let i = 0; i <= currentStep && i < knot.paths.length; i++) {
    const opacity = i < currentStep ? 0.4 : 1;
    const color = colors[i % colors.length];
    const parts = knot.paths[i].split(' M ');
    parts.forEach((part, pi) => {
      const d = pi === 0 ? part : 'M ' + part;
      pathsHtml += `<path d="${escapeHtml(d)}" stroke="${escapeHtml(color)}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="${opacity}"/>`;
    });
  }

  // Highlight current rope end
  const lastPath = knot.paths[currentStep];
  const lastPt = lastPath.match(/[\d.]+\s+[\d.]+/g);
  if (lastPt && lastPt.length > 0) {
    const [lx, ly] = lastPt[lastPt.length - 1].split(/\s+/);
    pathsHtml += `<circle cx="${escapeHtml(lx)}" cy="${escapeHtml(ly)}" r="3" fill="#FBBF24"/>`;
  }

  svg.innerHTML = pathsHtml;

  // Update step number
  const sn = document.getElementById('stepNum');
  if (sn) sn.textContent = currentStep + 1;
  const sd = document.getElementById('stepDesc');
  if (sd) sd.textContent = knot.steps[currentStep];

  // Update dots
  const dots = document.getElementById('stepDots');
  if (dots) {
    dots.innerHTML = knot.steps.map((_, i) =>
      `<span class="w-2 h-2 rounded-full ${i === currentStep ? 'bg-indigo-400' : 'bg-gray-600'} inline-block"></span>`
    ).join('');
  }

  // Update step list highlight
  const listItems = document.querySelectorAll('#knotDetail li');
  listItems.forEach((li, i) => {
    const dot = li.querySelector('.step-dot');
    const text = li.querySelector('span:last-child');
    if (dot) dot.className = `step-dot ${i === currentStep ? 'bg-indigo-500 text-white' : 'bg-gray-700 text-gray-400'}`;
    if (text) text.className = i === currentStep ? 'text-white text-sm' : 'text-gray-400 text-sm';
  });
}

function nextStep() {
  if (!selectedKnot) return;
  if (currentStep < selectedKnot.steps.length - 1) { currentStep++; renderStep(); }
}

function prevStep() {
  if (currentStep > 0) { currentStep--; renderStep(); }
}

function jumpStep(i) {
  currentStep = i;
  renderStep();
}

function autoPlay() {
  if (animInterval) {
    clearInterval(animInterval);
    animInterval = null;
    const btn = document.getElementById('autoBtn');
    if (btn) btn.textContent = '自動再生';
    return;
  }
  currentStep = 0;
  renderStep();
  const btn = document.getElementById('autoBtn');
  if (btn) btn.textContent = '停止';
  animInterval = setInterval(() => {
    if (!selectedKnot || currentStep >= selectedKnot.steps.length - 1) {
      clearInterval(animInterval);
      animInterval = null;
      const b = document.getElementById('autoBtn');
      if (b) b.textContent = '自動再生';
      return;
    }
    currentStep++;
    renderStep();
  }, 1500);
}

document.getElementById('searchInput').addEventListener('input', renderKnotList);
document.getElementById('categoryFilter').addEventListener('change', renderKnotList);

renderKnotList();
</script>
</body>
</html>
